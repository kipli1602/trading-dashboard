app = "trading-bot-singapore"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  USE_TESTNET = "true"

[experimental]
  cmd = ["npx", "next", "start", "-p", "3000"]

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1
  processes = ["app"]

[[services]]
  http_checks = [{ interval = "30s", timeout = "10s", grace_period = "30s" }]
  internal_port = 3000
  protocol = "tcp"

[machine]
  memory = "512MB"
  cpu_kind = "shared"
  cpus = 1
