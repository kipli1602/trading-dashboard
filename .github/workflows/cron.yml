name: 24/7 Bot Cron

on:
  schedule:
    # Run every 5 minutes, 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Manual trigger for testing

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger bot cron cycle (Fly.io Singapore = REAL trading)
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://trading-bot-singapore.fly.dev/api/bot?action=cron")
          if [ "$RESPONSE" == "200" ]; then
            echo "✅ Bot cron cycle triggered successfully on Fly.io Singapore"
          else
            echo "❌ Bot cron failed with status: $RESPONSE"
            # Fallback to Vercel (mock mode) if Fly.io not yet deployed
            VERCEL_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://trading-dashboard-kipli.vercel.app/api/bot?action=cron")
            echo "Vercel fallback status: $VERCEL_RESPONSE"
          fi
